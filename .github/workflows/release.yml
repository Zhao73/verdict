name: release

# Publishes a GitHub release whenever main carries a package.json version that has no tag yet.
# The notes are that version's section of CHANGELOG.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm ci --ignore-scripts && npm test
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"
            exit 0
          fi
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1 || index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Verdict $tag" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Verdict $tag" --notes-file notes.md
